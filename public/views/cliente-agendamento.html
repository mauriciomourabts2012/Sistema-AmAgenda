        <script> //Abrir e fechar todos os modals da pagina
            /* ============================
            CONFIGURAÇÃO DE CLASSES
            ============================ */
            const MODAL_CLASSES = ['modal-geral', 'modal-cards'];

            /* ============================
            FUNÇÕES
            ============================ */
            function abrirModal(id){
            const modal = document.getElementById(id);
            if(!modal){
                console.warn('Modal não encontrado:', id);
                return;
            }
            modal.classList.add('ativo');
            }

            function fecharModal(modal){
            modal.classList.remove('ativo');
            }

            function getModalPai(element){
            return element.closest(
                MODAL_CLASSES.map(c => '.' + c).join(',')
            );
            }

            /* ============================
            EVENTOS DE CLICK
            ============================ */
            document.addEventListener('click', (e) => {

            /* ABRIR */
            const abrir = e.target.closest('[data-abrir-modal]');
            if(abrir){
                abrirModal(abrir.getAttribute('data-abrir-modal'));
                return;
            }

            /* FECHAR (BOTÃO) */
            if(e.target.closest('[data-fechar-modal]')){
                const modal = getModalPai(e.target);
                if(modal) fecharModal(modal);
                return;
            }

            /* FECHAR (CLIQUE FORA) */
            MODAL_CLASSES.forEach(classe => {
                if(e.target.classList.contains(classe)){
                fecharModal(e.target);
                }
            });

            });

            /* ============================
            TECLA ESC
            ============================ */
            document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape'){
                MODAL_CLASSES.forEach(classe => {
                document
                    .querySelectorAll(`.${classe}.ativo`)
                    .forEach(m => fecharModal(m));
                });
            }
            });
        </script>

        <script> //script para navegação em Abas
        (() => {
        "use strict";

        function TabsUniversal(root = document) {
            const buttons = Array.from(root.querySelectorAll(".tab-btn"));
            const panes   = Array.from(root.querySelectorAll(".tab-pane"));
            if (!panes.length) return null;

            function activate(tabName) {
            const pane = root.querySelector(`#tab-${tabName}`);
            if (!pane) return;

            panes.forEach(p => p.classList.remove("active"));
            pane.classList.add("active");

            // se existir barra de tabs, marca ativo nela também
            if (buttons.length) {
                buttons.forEach(b => {
                b.classList.remove("active");
                b.setAttribute("aria-selected", "false");
                });

                const btn = buttons.find(b => b.dataset.tab === tabName);
                if (btn) {
                btn.classList.add("active");
                btn.setAttribute("aria-selected", "true");
                }
            }
            }

            return { go: activate };
        }

        document.addEventListener("DOMContentLoaded", () => {
            window.Tabs = TabsUniversal(document);

            // garante que inicia na primeira aba visível (se já tiver active, mantém)
            if (window.Tabs && typeof window.Tabs.go === "function") {
            const activePane = document.querySelector(".tab-pane.active");
            if (!activePane) window.Tabs.go("profissional");
            }
        });
        })();
        </script>
